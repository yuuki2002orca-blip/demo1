<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a3a5c" />
  <title>万屋一家 ｜ 給与明細</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">万</div>
        <div class="logo-text">
          <span class="company-name">万屋一家</span>
          <span class="system-name">給与明細システム</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="card">
        <h1 class="card-title">ログイン</h1>
        <p class="card-subtitle">従業員番号とパスワードを入力してください</p>

        <form id="loginForm" class="form" novalidate>
          <div class="form-group">
            <label for="employeeId" class="label">従業員番号</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input
                type="text"
                id="employeeId"
                name="employeeId"
                class="input"
                placeholder="例：EMP-12345"
                inputmode="text"
                autocomplete="username"
                autocapitalize="none"
                required
              />
            </div>
            <span class="error-msg" id="employeeIdError"></span>
          </div>

          <div class="form-group">
            <label for="password" class="label">パスワード</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input
                type="password"
                id="password"
                name="password"
                class="input"
                placeholder="パスワードを入力"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="パスワードを表示/非表示">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <span class="error-msg" id="passwordError"></span>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe" />
              <span class="checkbox-custom"></span>
              <span class="checkbox-text">ログイン状態を保持する</span>
            </label>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span class="btn-text">ログイン</span>
            <span class="btn-loading" style="display:none">
              <svg class="spinner" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle class="spinner-circle" cx="12" cy="12" r="10" fill="none" stroke-width="3"/></svg>
            </span>
          </button>

          <div class="alert alert-error" id="loginError" style="display:none">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="loginErrorMsg">従業員番号またはパスワードが正しくありません。</span>
          </div>
        </form>

        <div class="card-footer">
          <a href="#" class="link" id="forgotPassword">パスワードをお忘れの方はこちら</a>
        </div>
      </div>

      <div class="notice">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <p>このシステムは社内専用です。不正アクセスは禁止されています。</p>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 万屋一家. All rights reserved.</p>
    </footer>
  </div>

  <div class="modal" id="forgotModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-content">
      <h2 class="modal-title" id="modalTitle">パスワードリセット</h2>
      <p class="modal-body">パスワードのリセットは、総務部または情報システム部までお問い合わせください。</p>
      <div class="modal-contact">
        <div class="contact-item">
          <strong>総務部</strong>
          <span>内線：1001</span>
        </div>
        <div class="contact-item">
          <strong>情報システム部</strong>
          <span>内線：2001</span>
        </div>
      </div>
      <button class="btn-modal-close" id="modalClose">閉じる</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
